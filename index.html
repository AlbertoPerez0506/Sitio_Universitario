<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#30348C">

    <title>Universidad Tecnológica del Usumacinta (UTU) | Formación que se vive</title>
    <meta name="description" content="La Universidad Tecnológica del Usumacinta (UTU) forma profesionales con 60% práctica y 40% teoría, dos estadías profesionales y una ruta de TSU a Ingeniería o Licenciatura. Emiliano Zapata, Tabasco.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Universidad Tecnológica del Usumacinta">
    <link rel="canonical" href="https://www.utu.edu.mx/">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_MX">
    <meta property="og:site_name" content="Universidad Tecnológica del Usumacinta">
    <meta property="og:title" content="Universidad Tecnológica del Usumacinta (UTU)">
    <meta property="og:description" content="Formación que se vive. Conocimiento que se aplica.">
    <meta property="og:url" content="https://www.utu.edu.mx/">
    <meta property="og:image" content="https://www.utu.edu.mx/assets/images/branding/logo-utu.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- FAVICON: intacto -->
    <link rel="icon" href="/assets/images/icons/icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/footer.css">
    <link rel="stylesheet" href="/css/components/lightbox.css">
    <link rel="stylesheet" href="/css/pages/home.css">

    <script>document.documentElement.classList.add('js');</script>
</head>

<body data-page="home">

    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <div data-component="header"></div>

    <main id="contenido">

        <!-- ============================ HERO ============================ -->
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero__carousel" data-carousel data-autoplay="6500"
                 role="region" aria-roledescription="carrusel"
                 aria-label="Imágenes destacadas de la UTU">
                <div class="hero__track" data-carousel-track><!-- JS --></div>

                <button type="button" class="hero__nav hero__nav--prev" data-carousel-prev aria-label="Diapositiva anterior">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                </button>
                <button type="button" class="hero__nav hero__nav--next" data-carousel-next aria-label="Siguiente diapositiva">
                    <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                </button>

                <div class="hero__foot">
                    <div class="hero__dots" data-carousel-dots role="group" aria-label="Seleccionar diapositiva"></div>
                    <div class="hero__foot-actions">
                        <span class="hero__counter" aria-hidden="true">
                            <span class="hero__counter-current" data-carousel-current>01</span>
                            <span class="hero__counter-sep">/</span>
                            <span class="hero__counter-total" data-carousel-total>04</span>
                        </span>
                        <button type="button" class="hero__pause" data-carousel-toggle aria-label="Pausar carrusel" aria-pressed="false">
                            <svg class="icon hero__pause-icon hero__pause-icon--play" aria-hidden="true"><use href="#i-play"></use></svg>
                            <svg class="icon hero__pause-icon hero__pause-icon--pause" aria-hidden="true"><use href="#i-pause"></use></svg>
                        </button>
                    </div>
                </div>
                <div class="hero__progress" data-carousel-progress aria-hidden="true">
                    <span class="hero__progress-bar"></span>
                </div>
            </div>

            <ul class="hero__facts container" aria-label="Datos destacados de la UTU" data-hero-facts></ul>
        </section>

        <!-- ============================ INTRO ============================ -->
        <section class="section section--intro" aria-labelledby="intro-title">
            <div class="container">
                <div class="intro__grid">
                    <div class="intro__text reveal">
                        <p class="eyebrow" data-content="institucional.intro.eyebrow"></p>
                        <h2 class="section__title" id="intro-title">
                            <span data-content="institucional.intro.title"></span>
                            <span class="intro__title-accent" data-content="institucional.intro.titleAccent"></span>
                        </h2>
                        <p class="section__lead" data-content="institucional.intro.lead"></p>
                        <p class="text-muted" data-content="institucional.intro.texto"></p>
                        <ul class="intro__facts" aria-label="Datos institucionales" data-intro-facts></ul>
                        <a class="link-arrow" href="/pages/universidad/bienvenida.html" data-content-href="institucional.intro.linkCta.href">
                            <span data-content="institucional.intro.linkCta.label"></span>
                            <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                        </a>
                    </div>

                    <div class="intro__visual reveal" data-reveal-delay="120">
                        <div class="intro__decor" aria-hidden="true">
                            <span class="intro__decor-blob"></span>
                            <span class="intro__decor-dots"></span>
                        </div>
                        <figure class="intro__media">
                            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=1000&h=800&q=80&auto=format&fit=crop"
                                 alt="Estudiantes de la UTU durante una actividad práctica"
                                 width="1000" height="800" loading="lazy" decoding="async"
                                 data-img-fallback="Actividad práctica"
                                 data-img-content="institucional.intro.imagen">
                        </figure>
                        <div class="intro__badge" aria-hidden="true">
                            <span class="intro__badge-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4z"/><path d="m9 12 2 2 4-4"/></svg>
                            </span>
                            <span class="intro__badge-text">
                                <strong data-content="institucional.intro.badge.title"></strong>
                                <span data-content="institucional.intro.badge.subtitle"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <ul class="intro__pillars" data-intro-pillars></ul>
            </div>
        </section>

        <!-- ============================ RUTA ============================ -->
        <section class="section section--route" id="ruta" aria-labelledby="route-title">
            <div class="container">
                <header class="section__head section__head--center">
                    <p class="eyebrow" data-content="institucional.ruta.eyebrow"></p>
                    <h2 class="section__title" id="route-title">
                        <span data-content="institucional.ruta.titlePrefix"></span>
                        <span class="route__title-accent" data-content="institucional.ruta.titleAccent"></span>
                        <span data-content="institucional.ruta.titleSuffix"></span>
                    </h2>
                    <p class="section__lead section__lead--center" data-content="institucional.ruta.lead"></p>
                </header>

                <ol class="route__list" data-ruta-steps></ol>
            </div>
        </section>

        <!-- ============================ OFERTA ============================ -->
        <section class="section section--programs" id="oferta" aria-labelledby="programs-title">
            <div class="container">
                <header class="section__head section__head--center">
                    <p class="eyebrow" data-content="oferta.head.eyebrow"></p>
                    <h2 class="section__title" id="programs-title">
                        <span data-content="oferta.head.title"></span>
                        <span class="programs__title-accent" data-content="oferta.head.titleAccent"></span>
                    </h2>
                    <p class="section__lead section__lead--center" data-content="oferta.head.lead"></p>
                </header>

                <div class="programs__grid" data-programs-grid></div>

                <p class="programs__note">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    <span data-content="oferta.nota"></span>
                </p>
            </div>
        </section>

        <!-- ============================ VIDA UNIVERSITARIA ============================ -->
        <section class="section section--life" id="paraescolares" aria-labelledby="life-title">
            <div class="container">
                <div class="life__grid">
                    <div class="life__content reveal">
                        <p class="eyebrow" data-content="vidaUniversitaria.eyebrow"></p>
                        <h2 class="section__title" id="life-title">
                            <span data-content="vidaUniversitaria.title"></span>
                            <span class="life__title-accent" data-content="vidaUniversitaria.titleAccent"></span>
                        </h2>
                        <p class="section__lead" data-content="vidaUniversitaria.lead"></p>
                        <p class="text-muted" data-content="vidaUniversitaria.texto"></p>
                        <ul class="life__stats" aria-label="Datos de paraescolares" data-life-stats></ul>
                        <div class="life__cats" aria-label="Categorías de paraescolares" data-life-cats></div>
                        <a class="link-arrow" href="/pages/comunidad/paraescolares.html" data-content-href="vidaUniversitaria.linkCta.href">
                            <span data-content="vidaUniversitaria.linkCta.label"></span>
                            <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                        </a>
                    </div>

                    <div class="vintage reveal" data-reveal-delay="120"
                         data-vintage-gallery data-vintage-autoplay="5500"
                         role="region" aria-roledescription="galería de fotos"
                         aria-label="Galería de paraescolares de la UTU">
                        <div class="vintage__stage" data-vintage-stage>
                            <span class="vintage__stamp" aria-hidden="true">
                                <span data-vintage-current>01</span>
                                <span class="vintage__stamp-sep">/</span>
                                <span data-vintage-total>06</span>
                            </span>
                        </div>
                        <div class="vintage__controls">
                            <button class="vintage__nav vintage__nav--prev" type="button" data-vintage-prev aria-label="Foto anterior">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
                            </button>
                            <div class="vintage__dots" data-vintage-dots role="group" aria-label="Seleccionar foto"></div>
                            <button class="vintage__nav vintage__nav--next" type="button" data-vintage-next aria-label="Foto siguiente">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============================ NOTICIAS ============================ -->
        <section class="section section--news" aria-labelledby="news-title">
            <div class="container">
                <header class="section__head section__head--row">
                    <div>
                        <p class="eyebrow" data-content="noticias.head.eyebrow"></p>
                        <h2 class="section__title" id="news-title">
                            <span data-content="noticias.head.title"></span>
                            <span class="news__title-accent" data-content="noticias.head.titleAccent"></span>
                        </h2>
                        <p class="section__lead" data-content="noticias.head.lead"></p>
                    </div>
                    <a class="btn btn--outline btn--sm" href="/pages/noticias/index.html">
                        <span data-content="noticias.head.ctaLabel">Ver todas</span>
                        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                    </a>
                </header>
                <p class="news__note" data-news-note data-content="noticias.nota"></p>
                <div class="news__stage">
                    <div class="news__grid" data-news-grid></div>
                    <div class="news__empty" data-news-empty hidden>
                        <h3 class="news__empty-title">Aún no hay publicaciones</h3>
                        <p class="news__empty-text">Las noticias aparecerán aquí conforme se publiquen.</p>
                    </div>
                </div>
                <nav class="news__pagination" data-news-pagination aria-label="Paginación de noticias" hidden>
                    <button class="news__page-nav" type="button" data-news-prev aria-label="Página anterior">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
                    </button>
                    <ol class="news__page-list" data-news-pages></ol>
                    <button class="news__page-nav" type="button" data-news-next aria-label="Página siguiente">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                    </button>
                </nav>
                <p class="sr-only" data-news-status aria-live="polite"></p>
            </div>
        </section>

        <!-- ============================ EVENTOS ============================ -->
        <section class="section section--events" aria-labelledby="events-title">
            <div class="container">
                <header class="section__head section__head--row">
                    <div>
                        <p class="eyebrow" data-content="eventos.head.eyebrow"></p>
                        <h2 class="section__title" id="events-title" data-content="eventos.head.title"></h2>
                    </div>
                    <div class="events__controls" aria-label="Controles de eventos">
                        <button type="button" class="events__nav" data-events-prev aria-label="Evento anterior"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
                        <button type="button" class="events__nav" data-events-next aria-label="Siguiente evento"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
                    </div>
                </header>
                <p class="news__note" data-events-note data-content="eventos.nota"></p>
                <div class="events__viewport" data-events-viewport>
                    <ul class="events__track" data-events-track></ul>
                </div>
            </div>
        </section>

        <!-- ============================ COLLAGE ============================ -->
        <section class="section section--community" aria-labelledby="community-title">
            <div class="container">
                <header class="section__head section__head--center">
                    <p class="eyebrow" data-content="collage.eyebrow"></p>
                    <h2 class="section__title" id="community-title" data-content="collage.title"></h2>
                    <p class="section__lead section__lead--center" data-content="collage.lead"></p>
                </header>
                <div class="collage" data-collage></div>
            </div>
        </section>

        <!-- ============================ CTA ============================ -->
        <section class="section section--cta" aria-labelledby="cta-title">
            <div class="container">
                <div class="cta reveal">
                    <div class="cta__content">
                        <p class="eyebrow eyebrow--on-dark" data-content="cta.eyebrow"></p>
                        <h2 class="cta__title" id="cta-title" data-content="cta.title"></h2>
                        <p class="cta__text" data-content="cta.texto"></p>
                        <div class="cta__actions" data-cta-buttons></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-component="footer"></div>

    <!-- LIGHTBOX (sin cambios) -->
    <div class="lightbox" data-lightbox hidden>
        <div class="lightbox__backdrop" data-lightbox-close></div>
        <div class="lightbox__panel" role="dialog" aria-modal="true" aria-label="Visor de imágenes">
            <button type="button" class="lightbox__close" data-lightbox-close aria-label="Cerrar visor">
                <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
            <button type="button" class="lightbox__nav lightbox__nav--prev" data-lightbox-prev aria-label="Imagen anterior">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
            <figure class="lightbox__figure">
                <img class="lightbox__img" alt="" data-lightbox-img>
                <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
            </figure>
            <button type="button" class="lightbox__nav lightbox__nav--next" data-lightbox-next aria-label="Imagen siguiente">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
